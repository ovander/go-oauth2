name: Bug report
description: The Socrate server does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security vulnerability, do **not** open an issue: use the
        Security tab → Report a vulnerability.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The server version (`GET /api/version` or the `🔖 Socrate starting` log line), PostgreSQL version, and the client library if relevant.
      render: text
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authorization / token endpoint
        - Hosted login, consent or MFA
        - Discovery, JWKS or key rotation
        - Refresh, revocation or introspection
        - Admin API
        - Policy decision point (A4)
        - Monitoring, audit or alerts
        - Migrations or configuration
        - Deployment (Caddy, systemd, scripts)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The requests (method, path, parameters) and the relevant configuration modes.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs and correlation IDs
      description: The X-Request-Id / correlation_id of a failing request helps. Remove tokens, secrets and personal data before pasting.
