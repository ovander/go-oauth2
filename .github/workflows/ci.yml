# CI for go-oauth2 (Socrate): gofmt, build, vet, race-enabled tests against PostgreSQL,
# golangci-lint, govulncheck, the Tier A coverage ratchet and a k6 perf smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    # B4: a scratch Postgres so the shared-state and migration integration
    # tests actually run. Without TEST_DATABASE_URL they skip, which would
    # leave the SQL — the part unit tests cannot reach — unexercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/socrate_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # go.mod is the single source of truth for the Go that builds Socrate:
      # its toolchain line, or the go line when there is none (go mod tidy
      # drops a toolchain line equal to the go line). Fail loudly if this job
      # compiled with anything else, or if the Dockerfile's image has drifted
      # from it — the release image is what actually ships.
      # The release kit runs on the owner's Mac (bash 3.2) and the deploy scripts on the VPS:
      # catch a syntax error here, not mid-deploy. socrate-release.sh stays ASCII-only.
      - name: Deploy scripts parse
        run: |
          for f in deploy/release-kit/*.sh deploy/scripts/*.sh; do bash -n "$f" || exit 1; done
          if LC_ALL=C grep -n '[^[:print:][:space:]]' deploy/release-kit/socrate-release.sh; then
            echo "::error::deploy/release-kit/socrate-release.sh must stay ASCII-only"; exit 1
          fi

      # The Caddy updater runs as root against the live sites: exercise it end to end (dry run
      # and --apply) on fixture sites, with stub caddy/systemctl/curl, before it reaches the VPS.
      - name: Caddy updater test
        run: bash deploy/release-kit/test-caddy-update.sh

      - name: Toolchain matches go.mod (CI and Dockerfile)
        run: |
          want=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod)
          got=$(go env GOVERSION)
          image=go$(sed -nE 's/^FROM golang:([0-9.]+)-alpine.*/\1/p' Dockerfile)
          echo "go.mod toolchain: $want · CI: $got · Dockerfile: $image"
          test -n "$want" && test "$got" = "$want" && test "$image" = "$want"

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build golangci-lint with go.mod's toolchain
        # Pin the Go that builds golangci-lint to go.mod's (toolchain line, or
        # the go line when there is none): `go install` outside the module
        # would otherwise pick the oldest toolchain satisfying golangci-lint's
        # own requirement, and that binary refuses a module targeting a newer Go.
        run: |
          echo "GOTOOLCHAIN=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod)" >> "$GITHUB_ENV"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Build golangci-lint with the job's toolchain (go.mod's). A prebuilt
          # binary compiled with an older Go refuses a module whose toolchain
          # directive targets a newer one ("the Go language version used to
          # build golangci-lint is lower than the targeted Go version"), and a
          # linter older than the Go it reads cannot load its export data.
          install-mode: goinstall

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Same trap as golangci-lint: `go install` outside the module would build
      # govulncheck with the oldest Go its own go.mod accepts, and that binary
      # refuses a module targeting a newer Go ("package requires newer Go
      # version"). Build it with go.mod's Go, and pin it so a scanner release
      # never changes the result unannounced.
      - name: Install govulncheck with go.mod's toolchain
        run: |
          echo "GOTOOLCHAIN=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod)" >> "$GITHUB_ENV"
          GOTOOLCHAIN=$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "" ? t : g)}' go.mod) \
            go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck ./...

  # Coverage gate — Phase 8 of docs/TEST-STRATEGY.md.
  # The Tier A (security-critical) coverage check is now BLOCKING: a ratchet that
  # fails if coverage drops below TIER_A_MIN. The floor starts at the baseline and
  # is raised toward the >=90% target as the suites grow (so coverage can only go
  # up). Overall coverage is reported (non-blocking) and the profile uploaded.
  coverage:
    name: coverage gate (Tier A)
    runs-on: ubuntu-latest
    env:
      TIER_A_MIN: "55.0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Overall coverage (report)
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic > /dev/null
          echo "## Overall coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tier A coverage gate (blocking)
        run: |
          echo "## Tier A coverage gate (floor ${TIER_A_MIN}%, target 90%)" >> "$GITHUB_STEP_SUMMARY"
          bash scripts/coverage-gate.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            tierA.out

  # B6: a regression tripwire, not a benchmark. It boots a real server against a
  # real Postgres and drives the two paths whose latency is not dominated by a
  # constant we already know. The bcrypt-bound scenarios are excluded on
  # purpose: at ~14 rps they would add minutes per PR to re-measure bcrypt.
  # Thresholds come from docs/PERFORMANCE-BASELINE.md with generous headroom,
  # because a shared GitHub runner is noisy.
  perf:
    name: perf smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socrate_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, so a k6 release never changes the gate unannounced.
      - name: Install k6
        run: go install go.k6.io/k6@v1.8.1

      # The smoke test measures Socrate, not the runner's disk. With the default
      # AUDIT_WRITE_MODE=sync every token request appends an audit row under one
      # advisory lock, and each commit waits for an fsync; on a runner with a slow
      # or busy disk those waits queue every refresh (and the connections they hold)
      # behind the lock, and p95 swings from tens of ms to near a second for the same
      # code. Commits stay transactional and the code path is unchanged (sync audit,
      # the lock, the transaction): only the flush to this throwaway database's disk
      # is no longer awaited. Budgets are unchanged.
      - name: Do not wait for disk flushes on the scratch database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET synchronous_commit = off" -c "SELECT pg_reload_conf()"
          got=$(docker exec ${{ job.services.postgres.id }} psql -U postgres -tAc "SHOW synchronous_commit")
          echo "synchronous_commit=$got"
          test "$got" = "off"

      - name: Build the server
        run: go build -o /tmp/socrate ./cmd/server

      - name: Start the server
        env:
          PORT: "8080"
          ADMIN_PORT: "8081"
          ENV: development
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/socrate_perf?sslmode=disable
          OAUTH_ISSUER: http://localhost:8080
          SECRET_KEY_BASE: ci-perf-secret-key-base-at-least-32-characters
          AUTO_MIGRATE: "true"
          LOG_LEVEL: warn
          # The perf run would otherwise trip the very rate limits it drives.
          RATE_LIMIT_LOGIN: "1000000"
          RATE_LIMIT_SIGNUP: "1000000"
          RATE_LIMIT_TOKEN: "1000000"
        run: |
          /tmp/socrate > /tmp/socrate.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/health; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy:"; cat /tmp/socrate.log; exit 1

      - name: Seed the perf fixtures
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/socrate_perf?sslmode=disable
        run: go run ./deploy/perf/seed

      - name: Run the perf smoke
        env:
          BASE_URL: http://localhost:8080
          DURATION: 20s
        run: ./deploy/perf/run.sh discovery token_refresh

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/socrate.log
