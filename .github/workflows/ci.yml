# CI for go-oauth2 (Socrate) — RFC-014 / EPIC-6.
#
# Runs the quality gates that already pass on main: build, vet, race-enabled
# tests, and a vulnerability scan. gofmt/golangci-lint enforcement is a planned
# follow-up (the repo has pre-existing files that those tools would flag).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Coverage reporting — Phase 0 of docs/program/TEST-STRATEGY.md.
  # Report-only (never fails the build); Tier A thresholds become blocking in a
  # later phase. Prints the overall total and the Tier A (security-critical)
  # coverage, and uploads the profile as an artifact.
  coverage:
    name: coverage (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Overall coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic > /dev/null
          echo "## Overall coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tier A coverage (security-critical, target >=90%)
        run: |
          TIERA="./internal/service/...,./internal/shared/auth/...,./internal/middleware/...,./config/..."
          go test ./internal/service/... ./internal/shared/auth/... ./internal/middleware/... ./config/... \
            -coverpkg="$TIERA" -coverprofile=tierA.out > /dev/null
          echo "## Tier A coverage (security-critical, target >=90%, report-only)" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=tierA.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            tierA.out
