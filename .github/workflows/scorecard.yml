# OpenSSF Scorecard: checks the repository's supply-chain practices (branch protection, pinned
# dependencies, token permissions, signed releases…) weekly and on every push to main. The
# results are published for the README badge and uploaded to Security → Code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
