# Prometheus scrape config for a single-VPS Socrate deployment.
# Run Prometheus on the VPS (or reach :8081 over a private network); the
# metrics endpoint is on the loopback admin port and is never routed by Caddy.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/socrate-alert-rules.yml

scrape_configs:
  - job_name: socrate
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels: { service: socrate }
  # The console BFFs expose the same RED metrics once built with backendkit's
  # httpware.Metrics middleware (plan B1, backendkit companion).
