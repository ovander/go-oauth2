{{define "content"}}
<div class="card">
    <div class="card-header">
        <h1>Socrate</h1>
        <p>Sign in to your account</p>
    </div>
    <div class="card-body">
        {{if .Error}}
        <div class="alert alert-error">
            {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/auth/login">
            <input type="hidden" name="client_id" value="{{.ClientID}}">
            <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
            <input type="hidden" name="state" value="{{.State}}">
            <input type="hidden" name="scope" value="{{.Scope}}">
            <input type="hidden" name="response_type" value="{{.ResponseType}}">
            <input type="hidden" name="nonce" value="{{.Nonce}}">
            <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
            <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" value="{{.Email}}" required autofocus placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn">Sign in</button>
        </form>

        <div class="divider"><span>or</span></div>

        <p class="text-center text-muted">
            <a href="/auth/forgot-password?client_id={{.ClientID}}" class="link">Forgot your password?</a>
        </p>

        {{if .AllowSignup}}
        <p class="text-center text-muted" style="margin-top: 16px;">
            Don't have an account? <a href="/auth/signup?client_id={{.ClientID}}&redirect_uri={{.RedirectURI}}" class="link">Sign up</a>
        </p>
        {{end}}
    </div>
</div>
{{end}}
